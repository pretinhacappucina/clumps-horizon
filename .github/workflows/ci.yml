name: clumps-horizon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    working-directory: clumps-horizon
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Pinned mixin transformer
        run: |
          git clone https://github.com/horizon-rust/horizon-mixins ../horizon-mixins
          git -C ../horizon-mixins checkout "$(python3 -c 'import json; print(json.load(open("compatibility.json"))["horizon_mixins_revision"])')"
          cargo build --release --locked --manifest-path ../horizon-mixins/Cargo.toml -p horizon-mixins-cli
      - run: cargo test --workspace
      - name: Validate against pinned Horizon
        run: |
          T="$RUNNER_TEMP"
          git clone --filter=blob:none https://github.com/horizon-rust/horizon "$T/horizon"
          REV="$(python3 -c 'import json; print(json.load(open("compatibility.json"))["horizon_revision"])')"
          mkdir "$T/export" && git -C "$T/horizon" archive "$REV" | tar -x -C "$T/export"
          find "$T/export" -type l -exec sh -c 'c=$(readlink -f "$1"); rm "$1"; cp "$c" "$1"' _ {} \;
          echo "$REV" > "$T/export/.horizon-revision"
          ../horizon-mixins/target/release/horizon-mixins apply --workspace "$T/export" --mods "$PWD/mixins" --out "$T/staged"
          cd "$T/staged" && cargo check -p horizon-client
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: clumps-hnmod
          path: clumps-horizon/target/*.hnmod
